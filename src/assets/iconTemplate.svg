<!--
  Progressy mark: a progress ring, the same motif the cards use.
  Source for the menu bar icons. Black + alpha only: macOS uses the alpha
     channel and tints it, so it works in light and dark mode. Render at 44x44
     for iconTemplate@2x.png and 22x22 for iconTemplate.png.
-->
<svg width="44" height="44" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
  <g transform="rotate(-90 22 22)">
    <circle cx="22" cy="22" r="14" fill="none" stroke="#000" stroke-opacity="0.32" stroke-width="5"/>
    <circle cx="22" cy="22" r="14" fill="none" stroke="#000" stroke-width="5"
            stroke-linecap="round" stroke-dasharray="63.3 24.6"/>
  </g>
</svg>
